<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f7fb; font-family: Arial, Helvetica, sans-serif; color: #0f172a;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f5f7fb; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 580px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden;">
            <tr>
              <td style="background-color: #0a2881; padding: 20px 32px;">
                <span style="font-size: 22px; font-weight: 800; color: #ffffff;">BAI Finance</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">
                <h1 style="margin: 0 0 16px 0; font-size: 22px; line-height: 30px; color: #0a2881;">
                  {{ title }}
                </h1>
                <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 24px; color: #334155;">
                  {{ message|linebreaksbr }}
                </p>
                <table border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius: 8px; background-color: #0a2881;">
                      <a href="{{ action_url }}" style="display: inline-block; padding: 12px 22px; font-size: 14px; font-weight: 700; color: #ffffff; text-decoration: none;">
                        View in BAI Finance
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 28px 0 0 0; font-size: 12px; line-height: 20px; color: #64748b;">
                  You are receiving this because an important update was added to your account.
                </p>
                <p style="margin: 8px 0 0 0; font-size: 12px; line-height: 20px; color: #64748b;">
                  <a href="{{ unsubscribe_url }}" style="color: #0a2881;">Manage notification emails</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; font-size: 11px; color: #94a3b8;">
                &copy; {{ current_year }} BAI Finance. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
