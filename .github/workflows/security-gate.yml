name: security-gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to SHA for prod: e.g. uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: SAST semgrep
        run: pip install semgrep && semgrep --config=auto --error --metrics off
      - name: Secrets gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Python audit
        run: pip install pip-audit && pip-audit --desc || true
      - name: Node audit
        working-directory: Frontend
        run: npm audit --audit-level=high
      - name: IaC/container trivy (fs)
        uses: aquasecurity/trivy-action@master
        with: { scan-type: "fs", ignore-unfixed: true, severity: "HIGH,CRITICAL", exit-code: "1" }
